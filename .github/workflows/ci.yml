name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Types, lint and API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # The OpenAPI document is written by hand, so it can drift from the
      # routes. This fails when a route exists that nobody documented.
      - name: Check API docs cover every route
        run: node scripts/check-openapi.mjs

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build app image
        run: docker build -t growth-app .
      - name: Build cron image
        run: docker build -t growth-cron docker/cron
      - name: Build WhatsApp engine image
        run: docker build -t growth-whatsapp whatsapp

  test:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway database that exists only for this job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: growth
          POSTGRES_PASSWORD: growth
          POSTGRES_DB: growth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U growth"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://growth:growth@localhost:5432/growth
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      CI_TEST_API_KEY: sw_live_ci0000000000000000000000000000000000000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply migrations
        run: npm run db:migrate
      - name: Seed a test identity
        run: node scripts/seed-test-identity.mjs
        env:
          TEST_API_KEY: ${{ env.CI_TEST_API_KEY }}
      # The suite builds and starts the app itself, with no store and no
      # gateway configured — the state a fresh clone is in.
      - name: Run tests
        run: npm test
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
