name: Deploy to Azure

# Deploys main to Azure App Service after CI passes on it, or on demand.
#
# Needs, in the repository settings:
#   secret   AZURE_WEBAPP_PUBLISH_PROFILE  publish profile of the web app
#   variable AZURE_WEBAPP_NAME             e.g. setupsworks-growth
#   variable NEXT_PUBLIC_SITE_URL          e.g. https://setupsworks-growth.azurewebsites.net
# scripts/azure-setup.sh creates the app and sets all three.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      # Until the publish profile is added, skip quietly instead of failing.
      - name: Check deploy credentials
        id: creds
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::notice::AZURE_WEBAPP_PUBLISH_PROFILE is not set; skipping deploy. See README → Deployment → Azure."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          # The commit CI just passed, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Build package
        if: steps.creds.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: bash scripts/package-azure.sh

      - name: Deploy to App Service
        if: steps.creds.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
          type: zip
          clean: true
          restart: true

      - name: Check health
        if: steps.creds.outputs.ready == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.NEXT_PUBLIC_SITE_URL }}/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "The app did not become healthy in time." >&2
          exit 1
