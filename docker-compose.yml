# Setups Works Growth — the whole stack.
#
#   cp .env.example .env    # fill in POSTGRES_PASSWORD, AUTH_SECRET, CRON_SECRET,
#                           # WHATSAPP_ENGINE_KEY
#   docker compose up -d --build
#
# Add `--profile https` (and set DOMAIN) to put Caddy with automatic HTTPS in
# front, which WooCommerce needs to connect a store.

name: growth

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-growth}
      POSTGRES_USER: ${POSTGRES_USER:-growth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host. Uncomment to connect a local SQL client.
    # ports: ["127.0.0.1:5432:5432"]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
    image: growth-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-growth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-growth}
      WHATSAPP_ENGINE_URL: http://whatsapp:3001
      WHATSAPP_ENGINE_KEY: ${WHATSAPP_ENGINE_KEY:?set WHATSAPP_ENGINE_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"

  # WhatsApp: one linked-device session per account (users scan a QR in
  # Settings → WhatsApp). Pairings live in the wa-data volume, so restarts
  # reconnect without re-scanning. Not published to the host.
  whatsapp:
    build: ./whatsapp
    image: growth-whatsapp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-growth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-growth}
      WHATSAPP_ENGINE_KEY: ${WHATSAPP_ENGINE_KEY:?set WHATSAPP_ENGINE_KEY in .env}
    volumes:
      - wa-data:/data
    depends_on:
      app:
        condition: service_healthy

  cron:
    build: ./docker/cron
    image: growth-cron
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      APP_INTERNAL_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  wa-data:
  caddy-data:
  caddy-config:
